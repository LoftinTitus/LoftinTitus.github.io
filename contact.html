<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Titus Loftin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <main>
        <div class="main-content">
            <!-- Sidebar goes here -->
            <aside class="sidebar" data-sidebar>
                <div class="sidebar-info">
                    <figure class="profile-picture">
                        <img src="./assets/IMG_5622.jpeg" alt="Titus Loftin" width="80">
                    </figure>

                    <div class="info-content">
                        <h1 class="name" title="Titus Loftin">Titus Loftin</h1>
                        <p class="title">Engineer</p>
                    </div>

                    <button class="info_more-btn" data-sidebar-btn>
                        <span>Show Contacts</span>
                        <ion-icon name="chevron-down"></ion-icon>
                    </button>
                </div>

                <div class="sidebar-info_more">
                    <div class="separator"></div>

                    <ul class="contacts-list">
                        <li class="contact-item">
                            <div class="icon-box">
                                <ion-icon name="mail-outline"></ion-icon>
                            </div>
                            <div class="contact-info">
                                <p class="contact-title">Email</p>
                                <a href="mailto:loftintitus@gmail.com" class="contact-link">loftintitus@gmail.com</a>
                            </div>
                        </li>

                        <li class="contact-item">
                            <div class="icon-box">
                                <ion-icon name="phone-portrait-outline"></ion-icon>
                            </div>
                            <div class="contact-info">
                                <p class="contact-title">Phone</p>
                                <a href="tel:+5127650224" class="contact-link">512-765-0224</a>
                            </div>
                        </li>

                        <li class="contact-item">
                            <div class="icon-box">
                                <ion-icon name="calendar-outline"></ion-icon>
                            </div>
                            <div class="contact-info">
                                <p class="contact-title">Meetings</p>
                                <time datetime="">Schedule here</time>
                            </div>
                        </li>

                        <li class="contact-item">
                            <div class="icon-box">
                                <ion-icon name="location-outline"></ion-icon>
                            </div>
                            <div class="contact-info">
                                <p class="contact-title">Location</p>
                                <address>Austin, Texas, United States</address>
                            </div>
                        </li>
                    </ul>

                    <div class="separator"></div>

                    <ul class="social-list">
                        <li class="social-item">
                            <a href="https://github.com/LoftinTitus" class="social-link" target="_blank" rel="noopener noreferrer">
                                <i class="fab fa-github"></i>
                            </a>
                        </li>

                        <li class="social-item">
                            <a href="https://www.linkedin.com/in/titus-loftin-a71b442a8/" class="social-link" target="_blank" rel="noopener noreferrer">
                                <i class="fab fa-linkedin"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- Navbar goes here -->
            <nav class="navbar">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="index.html" class="navbar-link active">About</a>
                    </li>
                    <li class="navbar-item">
                        <a href="resume.html" class="navbar-link">Resume</a>
                    </li>
                    <li class="navbar-item">
                        <a href="portfolio.html" class="navbar-link">Portfolio</a>
                    </li>
                    <li class="navbar-item">
                        <a href="contact.html" class="navbar-link">Contact</a>
                    </li>
                </ul>
            </nav>

            <!-- Page content goes here -->
            <article class="about active">
                <!-- Homepage/About content -->
            </article>
        </div>
    </main>

    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
