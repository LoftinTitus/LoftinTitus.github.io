<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Titus Loftin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

</head>
<body>
    <main>
        <div class="main-content">

            <!-- Navbar goes here -->
            <nav class="navbar">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="index.html" class="navbar-link">About</a>
                    </li>
                    <li class="navbar-item">
                        <a href="resume.html" class="navbar-link">Resume</a>
                    </li>
                    <li class="navbar-item">
                        <a href="portfolio.html" class="navbar-link">Portfolio</a>
                    </li>
                    <li class="navbar-item">
                        <a href="contact.html" class="navbar-link active">Contact</a>
                    </li>
                </ul>
            </nav>

            <!-- Contact form-->
            <section class="contact-form">
                <header>
                    <h2 class="h2 article-title">Get in Touch</h2>
                    
                </header>
                <form data-form>
                  <input type="text" name="from_name" placeholder="Full name" required data-form-input>
                  <input type="email" name="from_email" placeholder="Email address" required data-form-input>
                  <textarea name="message" placeholder="Your message" required data-form-input></textarea>
                  <button type="submit" class="btn" data-form-button>Send Message</button>
                </form>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
