<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Titus Loftin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <main>
        <div class="main-content">
            <!-- Navbar -->
            <nav class="navbar">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="index.html" class="navbar-link">About</a>
                    </li>
                    <li class="navbar-item">
                        <a href="resume.html" class="navbar-link">Resume</a>
                    </li>
                    <li class="navbar-item">
                        <a href="portfolio.html" class="navbar-link">Portfolio</a>
                    </li>
                    <li class="navbar-item">
                        <a href="contact.html" class="navbar-link active">Contact</a>
                    </li>
                </ul>
            </nav>

            <div class="contact-wrapper">
                <!-- Contact details Section -->
                <aside class="contact-sidebar">
                    <header>
                        <h2 class="h2 article-title">Contact Information</h2>
                    </header>
                    
                    <div class="contact-details">
                        <div class="contact-item">
                            <div class="contact-icon">
                                <ion-icon name="mail-outline"></ion-icon>
                            </div>
                            <div class="contact-text">
                                <h4>Email</h4>
                                <p>loftintitus@utexas.edu</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">
                                <ion-icon name="call-outline"></ion-icon>
                            </div>
                            <div class="contact-text">
                                <h4>Phone</h4>
                                <p>(512) 765 0224</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <ion-icon name="location-outline"></ion-icon>
                            </div>
                            <div class="contact-text">
                                <h4>Location</h4>
                                <p>Austin, Texas</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">
                                <ion-icon name="document-outline"></ion-icon>
                            </div>
                            <div class="contact-text">
                                <h4>Resume</h4>
                                <p><a href="resume.pdf" download>Download here</a></p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">
                                <ion-icon name="calendar-outline"></ion-icon>
                            </div>
                            <div class="contact-text">
                                <h4>Schedule Meeting</h4>
                                <div class="scheduler-form">
                                    <select class="form-input scheduler-select" id="meeting-type">
                                        <option value="">Select meeting type</option>
                                        <option value="consultation">Consultation</option>
                                        <option value="collaboration">Collaboration</option>
                                        <option value="interview">Interview</option>
                                        <option value="other">Other</option>
                                    </select>
                                    <input type="date" class="form-input scheduler-input" id="meeting-date" placeholder="Preferred date">
                                    <input type="time" class="form-input scheduler-input" id="meeting-time" placeholder="Preferred time">
                                    <button type="button" class="scheduler-btn" onclick="requestMeeting()">
                                        <ion-icon name="calendar"></ion-icon>
                                        <span>Request Meeting</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </aside>
                
                <!-- Contact form -->
                <section class="contact-form">
                    <header>
                        <h2 class="h2 article-title">Get in Touch</h2>
                    </header>
                    
                    <form data-form class="form">
                        <div class="input-wrapper">
                            <input type="text" name="from_name" class="form-input" placeholder="Full name" required data-form-input>
                            <input type="email" name="from_email" class="form-input" placeholder="Email address" required data-form-input>
                        </div>
                        
                        <textarea name="message" class="form-input" placeholder="Your message" required data-form-input></textarea>
                        
                        <button class="form-btn" type="submit" data-form-btn>
                            <ion-icon name="paper-plane"></ion-icon>
                            <span>Send Message</span>
                        </button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
